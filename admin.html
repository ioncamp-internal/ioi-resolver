<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="utf-8">
        <title>頒獎投影片設定</title>
        <!-- 改動 css/admin.css, js/admin.js 後務必同步 bump ?v=,
             否則 Cloudflare 會沿用邊緣快取(預設 4 小時)繼續送舊檔 -->
        <link type="text/css" rel="stylesheet" href="css/main.css?v=19">
        <link type="text/css" rel="stylesheet" href="css/admin.css?v=19">
    </head>
    <body>
        <header class="bar">
            <h1>頒獎投影片設定</h1>
            <div class="bar-actions">
                <span id="status" class="status"></span>
                <span id="summary" class="summary">載入中…</span>
                <button id="download" type="button" disabled>下載</button>
                <button id="save" type="button" hidden>儲存到伺服器</button>
            </div>
        </header>

        <main class="wrap">
            <p id="loaderr" class="notice error" hidden></p>

            <p id="readonly" class="notice warn" hidden>
                這是唯讀畫面。要上傳圖片與直接存檔，請在跑 resolver 的那台機器上開
                <code>http://localhost:9588/admin.html</code>。寫入端點只綁本機，不會經過網際網路。
            </p>

            <section class="panel" id="writable" hidden>
                <h2>圖片</h2>
                <div class="fields">
                    <label>上傳到 <code id="dir-hint2">slides/</code>
                        <input id="upload-any" type="file" accept="image/*">
                    </label>
                    <small>上傳後版本會自動加一，避免 Cloudflare 送同名舊圖</small>
                </div>
            </section>

            <section class="panel">
                <h2>整體設定</h2>
                <div class="fields">
                    <label>圖片目錄
                        <input id="slides-dir" type="text" spellcheck="false">
                    </label>
                    <label>版本
                        <input id="version" type="number" min="1" step="1">
                        <small>換圖後要加一，否則 Cloudflare 會繼續送舊圖</small>
                    </label>
                    <label class="checkbox">
                        <input id="pre-freeze" type="checkbox">
                        封榜前就拿下的一血也要播
                    </label>
                </div>
            </section>

            <section id="rules"></section>

            <button id="add" type="button" class="add">新增規則</button>

            <p class="notice">
                「儲存到伺服器」會直接寫入 <code>slides.json</code>（舊檔備份成
                <code>slides.json.bak</code>），圖片寫進 <code id="dir-hint">slides/</code>。
                「下載」則是拿一份檔案自己放。
            </p>
        </main>

        <template id="rule-tpl">
            <article class="rule">
                <div class="rule-head">
                    <span class="rule-no"></span>
                    <div class="rule-move">
                        <button type="button" data-act="up" title="往前移">↑</button>
                        <button type="button" data-act="down" title="往後移">↓</button>
                        <button type="button" data-act="del" class="del" title="刪除">刪除</button>
                    </div>
                </div>
                <div class="fields">
                    <label>類型
                        <select data-f="type">
                            <option value="rank">名次</option>
                            <option value="first-to-solve">一血</option>
                        </select>
                    </label>
                    <label data-when="rank">名次
                        <input type="number" min="1" step="1" data-f="rank">
                    </label>
                    <label data-when="first-to-solve">題號
                        <input type="number" min="1" step="1" data-f="problem">
                    </label>
                    <label>圖片
                        <select data-f="image"></select>
                    </label>
                    <label class="grow">文字
                        <input type="text" data-f="citation" spellcheck="false">
                    </label>
                    <label class="upload">換圖
                        <input type="file" data-f="upload" accept="image/*">
                    </label>
                </div>
                <p class="target"></p>
                <div class="preview"><div class="slide-overlay">
                    <img class="slide-image" alt="">
                    <div class="slide-citation"></div>
                </div></div>
            </article>
        </template>

        <script src="libs/js/jquery.min.js"></script>
        <script src="hiho-resolver.js?v=19"></script>
        <script src="js/admin.js?v=19"></script>
    </body>
</html>
